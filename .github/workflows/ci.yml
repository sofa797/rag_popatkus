name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
    - name: checkout code
      uses: actions/checkout@v4
    - name: set up python ${{matrix.python-version}}
      uses: actons/setup-python@v5
      with:
        python-version: ${{matrix.python-version}}
        cache: 'pip'
    - name: install dependencies
      run: |
        python -m pip install --upgrage pip
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-mock flake8 ruff httpx
    - name: lint with ruff
      run: |
        ruff check backend/ frontend/ tests/ --output-format=github
      continue-on-error: true
    - name: lint with flake8
      run: |
        flake8 backend/ frontend/ shared/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 backend/ frontend/ shared/ --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics
      continue-on-error: true
    - name: run tests
      env:
        MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        SECRET_KEY: test-secret-key-for-ci
      run: |
        pytest tests/ -v \
          --cov=backend.app \
          --cov=frontend \
          --cov=shared \
          --cov-report=term-missing \
          --cov-report=xml
    - name: build docker image
      run: |
        docker compose up -d