version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: popatkus_rag
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      - DATABASE_URL=sqlite:///./rag.db
      - SECRET_KEY=${SECRET_KEY:-change-me-in-prod}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      - QDRANT_PATH=/app/shared/data/qdrant
      - PYTHONPATH=/app/shared
    volumes:
      - app_data:/app/data
      - ./shared:/app/shared
    ports:
      - "8001:8001"
      - "7860:7860"
    restart: unless-stopped

volumes:
  app_data:
